name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.9"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # This validates syntax and internal consistency only — no backend/state and no live
      # GCP credentials are needed for `fmt`/`validate`, so the GCS backend (which requires
      # bucket/prefix from the gitignored backend.hcl) is skipped entirely. Live `plan`/`apply`
      # against the real project happen in terraform-plan / terraform-apply below.
      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate

  # Runs `terraform plan` against the real project and posts the plan as a PR comment, so
  # review happens against the actual infra change, not just the source diff. Read-only:
  # nothing here can touch real resources. See docs/adr/0003.
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: terraform-check
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"
      - run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '#### Terraform Plan';
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(0, 60000);
            const body = `${marker}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Detects whether a push to main touched terraform/, so terraform-apply only runs (and
  # only prompts the required reviewer) when there's an actual infra change to apply — not
  # on every merge. Skipped entirely outside of push events.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  # Applies to the real project. Runs automatically when a push to main touches terraform/,
  # or on demand via Actions tab -> Run workflow. The terraform-apply environment requires a
  # manual reviewer approval before this actually executes (available now that the repo is
  # public, per ADR-0003) and restricts it to the main branch — that approval is the human
  # checkpoint, not the trigger itself.
  terraform-apply:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.terraform == 'true')
    runs-on: ubuntu-latest
    needs: [terraform-check, changes]
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"
      - run: |
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}"

  dataform-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Dataform 3.x resolves @dataform/core from `dataformCoreVersion` in
      # workflow_settings.yaml — no package.json/npm install needed.
      # Compiles the SQLX project without needing a live BigQuery connection.
      - run: npx --yes @dataform/cli@3.0.0 compile

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Smoke test only — no push to a registry. That needs Artifact Registry + credentials,
      # which land once the GCP project is provisioned (docs/adr/0003).
      - run: docker build -f src/ingestion/Dockerfile .
