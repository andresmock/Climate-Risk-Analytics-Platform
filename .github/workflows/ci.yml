name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.9"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # This validates syntax and internal consistency only — no backend/state and no live
      # GCP credentials are needed for `fmt`/`validate`, so the GCS backend (which requires
      # bucket/prefix from the gitignored backend.hcl) is skipped entirely. Live `plan` against
      # the real project happens in terraform-plan below; `apply` is local-only (see ADR-0012).
      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate

  # Runs `terraform plan` against the real project and posts the plan as a PR comment, so
  # review happens against the actual infra change, not just the source diff. Read-only:
  # nothing here can touch real resources. See docs/adr/0003.
  terraform-plan:
    # Restricted to PRs opened from this repo, not forks: a fork PR supplies its own workflow
    # file for `pull_request` runs, so without this check it would still get this job's
    # terraform-ci WIF impersonation and pull-requests: write token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: terraform-check
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.TF_STATE_PREFIX }}"
      - run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="github_actions_wif_member=${{ vars.GCP_WIF_MEMBER }}" \
            -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '#### Terraform Plan';
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(0, 60000);
            const body = `${marker}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  dataform-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Dataform 3.x resolves @dataform/core from `dataformCoreVersion` in
      # workflow_settings.yaml — no package.json/npm install needed.
      # Compiles the SQLX project without needing a live BigQuery connection.
      - run: npx --yes @dataform/cli@3.0.0 compile

  # Builds the ingestion image as a smoke test on every trigger. On push to main, if
  # ingestion's own source changed, also pushes the image to Artifact Registry and points
  # the live Cloud Run Job at it — independent of terraform apply, which is local-only (see
  # ADR-0012). See docs/adr/0005 for why image deploys are deliberately decoupled from it.
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/ingestion/Dockerfile -t ingestion:ci .

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingestion:
              - 'src/ingestion/**'
              - 'pyproject.toml'
              - 'uv.lock'
      - if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.filter.outputs.ingestion == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INGESTION_DEPLOY_SERVICE_ACCOUNT }}
      - if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.filter.outputs.ingestion == 'true'
        uses: google-github-actions/setup-gcloud@v2
      # Hardcoded rather than a repo variable: must match `region`'s default in
      # terraform/variables.tf, which this job has no Terraform state access to read.
      - if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.filter.outputs.ingestion == 'true'
        run: gcloud auth configure-docker "europe-west6-docker.pkg.dev" --quiet
      - if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.filter.outputs.ingestion == 'true'
        run: |
          IMAGE="europe-west6-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ingestion/ingestion:${{ github.sha }}"
          docker tag ingestion:ci "$IMAGE"
          docker push "$IMAGE"
          gcloud run jobs update ingestion \
            --image="$IMAGE" \
            --region="europe-west6" \
            --project="${{ vars.GCP_PROJECT_ID }}"
