[project]
name = "climate-risk-analytics-platform"
version = "0.1.0"
description = "Climate Risk Analytics Platform — reference data engineering platform on GCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
